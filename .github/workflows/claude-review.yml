name: Claude Code Review

on:
  # Run after CI completes (on pushes to main and PRs)
  workflow_run:
    workflows: ["CI"]
    types: [completed]

  # Respond to @claude in comments
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  # ── PR Review: uses the official action (posts inline comments) ──
  pr-review:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Get CI result
        id: ci
        run: echo "result=${{ github.event.workflow_run.conclusion }}" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: "--model claude-opus-4-6 --max-turns 15 --allowedTools Read,Edit,Write,Bash(git:*),Bash(gh:*),mcp__github_inline_comment__create_inline_comment,mcp__github_ci__get_ci_status,mcp__github_ci__download_job_log"
          prompt: |
            CI just finished with result: **${{ steps.ci.outputs.result }}**

            If CI failed, investigate:
              gh run view ${{ github.event.workflow_run.id }} --log-failed --repo ${{ github.repository }}

            Review the PR changes. If CI failed, diagnose the root cause.

            If you find a clear, simple fix (typo, missing import, small logic error):
            - Make the fix directly and commit it with a clear message
            - Push the fix to the PR branch

            For complex issues or design problems, just leave review comments explaining the problem.

            Do NOT fix style nitpicks. Only fix things that are genuinely broken or wrong.

  # ── Push Review: runs Claude Code CLI directly (action doesn't support push events) ──
  push-review:
    if: >
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Review push to main
        run: |
          claude -p "CI just finished with result: ${{ github.event.workflow_run.conclusion }}

          If CI failed, investigate:
            gh run view ${{ github.event.workflow_run.id }} --log-failed --repo ${{ github.repository }}

          Review the latest push to main:
            git diff HEAD~1 HEAD

          Analyse for bugs, security issues, or code that doesn't match existing patterns.

          If CI failed and the fix is clear and simple (typo, missing import, small logic error):
            Create a GitHub issue with the fix details:
              gh issue create --title 'CI fix needed: <summary>' --body '<details and suggested fix>' --assignee ManningAskew7 --repo ${{ github.repository }}

          If there are non-CI problems worth flagging, create a GitHub issue:
            gh issue create --title 'Review: <summary>' --body '<details>' --assignee ManningAskew7 --repo ${{ github.repository }}

          If everything looks good and CI passed, do nothing.
          Do NOT flag style nitpicks. Only flag things that are genuinely broken or wrong." \
            --model claude-opus-4-6 \
            --max-turns 15 \
            --allowedTools "Read,Bash(git diff:*),Bash(git log:*),Bash(gh issue create:*),Bash(gh run view:*)"

  # ── Interactive: respond to @claude mentions ──
  interactive:
    if: >
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: "--model claude-opus-4-6 --max-turns 15 --allowedTools Read,Edit,Write,Bash(git:*),Bash(gh:*)"
