name: Claude Code Review

on:
  # Run after CI completes (on pushes to main and PRs)
  workflow_run:
    workflows: ["CI"]
    types: [completed]

  # Respond to @claude in comments
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.workflow_run.head_sha || github.event.comment.id || github.run_id }}
  cancel-in-progress: true

jobs:
  # ── PR Review: uses the official action (posts inline comments) ──
  pr-review:
    # Only same-repo (non-fork) PRs. A fork PR's HEAD is attacker-controlled,
    # and workflow_run runs in the base repo with secrets, so reviewing fork
    # content with write-capable tools is the classic privilege-escalation
    # anti-pattern. Fork PRs are simply not auto-reviewed here.
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.head_repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Review-only: no contents:write and no write tools, so even a malicious
    # diff cannot steer the job into committing to the repo or abusing the
    # GITHUB_TOKEN. It posts inline review comments only.
    permissions:
      contents: read
      pull-requests: write
      issues: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Get CI result
        id: ci
        run: echo "result=${{ github.event.workflow_run.conclusion }}" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: "--model claude-opus-4-6 --max-turns 15 --allowedTools Read,Bash(gh run view:*),mcp__github_inline_comment__create_inline_comment,mcp__github_ci__get_ci_status,mcp__github_ci__download_job_log"
          prompt: |
            CI just finished with result: **${{ steps.ci.outputs.result }}**

            If CI failed, investigate:
              gh run view ${{ github.event.workflow_run.id }} --log-failed --repo ${{ github.repository }}

            Review the PR changes. If CI failed, diagnose the root cause.

            Leave inline review comments explaining any problems you find (bugs,
            security issues, root cause of a CI failure, or a suggested fix).
            This job is review-only: do NOT attempt to edit files, commit, or
            push. Describe the fix in a comment instead.

            Do NOT flag style nitpicks. Only flag things that are genuinely broken or wrong.

  # ── Push Review: runs Claude Code CLI directly (action doesn't support push events) ──
  push-review:
    if: >
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Read-only review that files issues; it never edits or pushes, so it does
    # not need contents:write.
    permissions:
      contents: read
      issues: write
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Review push to main
        run: |
          claude -p "CI just finished with result: ${{ github.event.workflow_run.conclusion }}

          If CI failed, investigate:
            gh run view ${{ github.event.workflow_run.id }} --log-failed --repo ${{ github.repository }}

          Review the latest push to main:
            git diff HEAD~1 HEAD

          Analyse for bugs, security issues, or code that doesn't match existing patterns.

          If CI failed and the fix is clear and simple (typo, missing import, small logic error):
            Create a GitHub issue with the fix details:
              gh issue create --title 'CI fix needed: <summary>' --body '<details and suggested fix>' --assignee ManningAskew7 --repo ${{ github.repository }}

          If there are non-CI problems worth flagging, create a GitHub issue:
            gh issue create --title 'Review: <summary>' --body '<details>' --assignee ManningAskew7 --repo ${{ github.repository }}

          If everything looks good and CI passed, do nothing.
          Do NOT flag style nitpicks. Only flag things that are genuinely broken or wrong." \
            --model claude-opus-4-6 \
            --max-turns 15 \
            --allowedTools "Read,Bash(git diff:*),Bash(git log:*),Bash(gh issue create:*),Bash(gh run view:*)"

  # ── Interactive: respond to @claude mentions ──
  interactive:
    # Only trusted association levels can drive this write-capable job. Without
    # this gate, once the repo is public ANY commenter who writes "@claude"
    # could steer it (it has contents/PR/issues write). OWNER/MEMBER/COLLABORATOR
    # are the GitHub roles that already imply repo trust.
    if: >
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
      ) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: "--model claude-opus-4-6 --max-turns 15 --allowedTools Read,Edit,Write,Bash(git:*),Bash(gh:*)"
