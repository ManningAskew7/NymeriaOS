name: Claude Code Review

on:
  # Run after CI completes (on pushes to main and PRs)
  workflow_run:
    workflows: ["CI"]
    types: [completed]

  # Respond to @claude in comments
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  # ── PR Review: posts inline comments on the PR ──
  pr-review:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Get CI result
        id: ci
        run: echo "result=${{ github.event.workflow_run.conclusion }}" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: claude-opus-4-6
          claude_args: "--max-turns 15 --allowedTools Read,Edit,Write,Bash(git:*),Bash(gh:*),mcp__github_inline_comment__create_inline_comment"
          prompt: |
            CI just finished with result: **${{ steps.ci.outputs.result }}**

            If CI failed, investigate:
              gh run view ${{ github.event.workflow_run.id }} --log-failed --repo ${{ github.repository }}

            Review the PR changes. If CI failed, diagnose the root cause.

            If you find a clear, simple fix (typo, missing import, small logic error):
            - Make the fix directly and commit it with a clear message
            - Push the fix to the PR branch

            For complex issues or design problems, just leave review comments explaining the problem.

            Do NOT fix style nitpicks. Only fix things that are genuinely broken or wrong.

  # ── Push Review: reviews commits pushed to main ──
  push-review:
    if: >
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Get CI result
        id: ci
        run: echo "result=${{ github.event.workflow_run.conclusion }}" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: claude-opus-4-6
          claude_args: "--max-turns 15 --allowedTools Read,Edit,Write,Bash(git:*),Bash(gh:*)"
          prompt: |
            CI just finished with result: **${{ steps.ci.outputs.result }}**

            If CI failed, investigate:
              gh run view ${{ github.event.workflow_run.id }} --log-failed --repo ${{ github.repository }}

            Review the latest push to main:
              git diff HEAD~1 HEAD

            Analyse for bugs, security issues, or code that doesn't match existing patterns.

            If CI failed and the fix is clear and simple (typo, missing import, small logic error):
            - Make the fix directly, commit it, and push to main

            If there are problems you can't confidently fix, create a GitHub issue:
              gh issue create --title "Review: <short summary>" --body "<details>"

            If everything looks good and CI passed, do nothing.
            Do NOT fix style nitpicks. Only fix things that are genuinely broken or wrong.

  # ── Interactive: respond to @claude mentions ──
  interactive:
    if: >
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: claude-opus-4-6
          claude_args: "--max-turns 15 --allowedTools Read,Edit,Write,Bash(git:*),Bash(gh:*)"
