name: CI

on:
  # Manual only. GitHub-hosted Actions currently consume paid minutes for this account.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plaintext-secrets:
    name: Plaintext secret guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Reject plaintext runtime secrets
        run: python3 scripts/check_no_plaintext_secrets.py

  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check release versions
        run: python scripts/sync_versions.py --check

      - name: Check requirements/pyproject dependency sync
        run: python scripts/check_requirements_sync.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Nymeria/requirements-dev.txt

      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Nymeria/requirements-dev.txt

      - name: Run Ruff
        run: python -m ruff check Nymeria/nymeria Nymeria/tests Nymeria/run.py

  type-check:
    name: Pyrefly type check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            Nymeria/requirements.txt
            Nymeria/requirements-dev.txt
            Nymeria/requirements-docker.txt
            Nymeria/requirements-postgres.txt
            Nymeria/requirements-sqlite.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Nymeria/requirements.txt -r Nymeria/requirements-docker.txt -r Nymeria/requirements-dev.txt

      - name: Run pyrefly
        working-directory: Nymeria
        run: pyrefly check

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: Nymeria

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Neutralize git-crypt encrypted files for CI
        run: |
          for f in Nymeria/.env.docker Nymeria/.env; do
            if [ -f "$f" ] && head -c 10 "$f" 2>/dev/null | grep -aq GITCRYPT; then
              printf '# Placeholder for CI (original is git-crypt encrypted)\n' > "$f"
              echo "Neutralized encrypted file: $f"
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            Nymeria/requirements.txt
            Nymeria/requirements-dev.txt
            Nymeria/requirements-docker.txt
            Nymeria/requirements-postgres.txt
            Nymeria/requirements-sqlite.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Nymeria/requirements.txt -r Nymeria/requirements-docker.txt -r Nymeria/requirements-dev.txt

      - name: Run pytest with coverage
        run: python -m pytest Nymeria/tests -n auto --cov=nymeria --cov=run --cov-report=term --cov-report=xml:Nymeria/coverage.xml --cov-fail-under=38

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: Nymeria/coverage.xml
          retention-days: 30

  desktop-check:
    name: Desktop type check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Cache npm packages
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-desktop-${{ hashFiles('nymeria-desktop/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-desktop-

      - name: Install desktop dependencies
        working-directory: nymeria-desktop
        run: npm ci

      - name: Run desktop check
        working-directory: nymeria-desktop
        run: npm run check

      - name: Run desktop tests
        working-directory: nymeria-desktop
        run: npm run test

  mobile-check:
    name: Mobile type check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: nymeria-mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: nymeria-mobile
        run: npm ci

      - name: Run mobile check
        working-directory: nymeria-mobile
        run: npm run check

      - name: Run mobile tests
        working-directory: nymeria-mobile
        run: npm run test

  desktop-rust-tests:
    name: Desktop Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            build-essential curl wget file libxdo-dev libssl-dev pkg-config \
            libdbus-1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: nymeria-desktop/src-tauri

      - name: Run cargo test
        working-directory: nymeria-desktop/src-tauri
        run: cargo test

  cross-app-drift:
    name: Cross-app drift check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check desktop/mobile drift
        run: python scripts/check_cross_app_drift.py

  docker-validation:
    name: Docker validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISCORD_BOT_TOKEN: disabled
      TELEGRAM_BOT_TOKEN: disabled
      TWITCH_CHANNEL: channelname

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate default compose config
        working-directory: Nymeria
        run: docker compose --env-file .env.docker.example -f docker-compose.yml config --quiet

      - name: Validate all-profile compose config
        working-directory: Nymeria
        run: docker compose --profile discord --profile telegram --profile slack --profile voice --env-file .env.docker.example -f docker-compose.yml config --quiet

      - name: Validate single-container published compose
        working-directory: Nymeria
        run: |
          # This compose declares `env_file: .env.docker`, which is gitignored,
          # so seed it from the committed example for validation only.
          cp .env.docker.example .env.docker
          docker compose -f docker-compose.single.published.yml config --quiet
          rm -f .env.docker

      - name: Check full Dockerfile
        working-directory: Nymeria
        run: docker buildx build --check -f Dockerfile.full .

      - name: Check slim Dockerfile
        working-directory: Nymeria
        run: docker buildx build --check -f Dockerfile.slim .
