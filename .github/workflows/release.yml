name: Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python-package:
    name: Build Python package
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Cache desktop npm packages
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-desktop-release-${{ hashFiles('nymeria-desktop/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-desktop-release-
            ${{ runner.os }}-npm-desktop-

      - name: Install desktop dependencies
        working-directory: nymeria-desktop
        run: npm install

      - name: Build desktop frontend
        working-directory: nymeria-desktop
        run: npm run build

      - name: Bundle frontend into Python package
        run: |
          rm -rf Nymeria/nymeria/frontend
          mkdir -p Nymeria/nymeria/frontend
          cp -a nymeria-desktop/build/. Nymeria/nymeria/frontend/
          test -f Nymeria/nymeria/frontend/index.html
          test -d Nymeria/nymeria/frontend/_app

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            Nymeria/pyproject.toml
            Nymeria/requirements-dev.txt

      - name: Install Python build tools
        run: python -m pip install --upgrade pip build twine

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/sync_versions.py --check --tag "$GITHUB_REF_NAME"

      - name: Clean Python build outputs
        working-directory: Nymeria
        run: rm -rf build dist *.egg-info

      - name: Build Python distribution
        working-directory: Nymeria
        run: python -m build

      - name: Check Python distribution metadata
        working-directory: Nymeria
        run: python -m twine check dist/*.whl dist/*.tar.gz

      - name: Upload Python distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: nymeria-python-dist
          path: |
            Nymeria/dist/*.whl
            Nymeria/dist/*.tar.gz
          if-no-files-found: error

  windows-desktop:
    name: Build Windows desktop installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Cache desktop npm packages
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-desktop-release-${{ hashFiles('nymeria-desktop/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-desktop-release-
            ${{ runner.os }}-npm-desktop-

      - name: Install desktop dependencies
        working-directory: nymeria-desktop
        run: npm install

      - name: Set up Python for version check
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/sync_versions.py --check --tag "$env:GITHUB_REF_NAME"

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Rust build outputs
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nymeria-desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-tauri-release-${{ hashFiles('nymeria-desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tauri-release-
            ${{ runner.os }}-cargo-tauri-

      - name: Build Tauri NSIS installer
        working-directory: nymeria-desktop
        run: npm run tauri build

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: nymeria-windows-installer
          path: nymeria-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  github-release:
    name: Upload GitHub Release assets
    needs:
      - python-package
      - windows-desktop
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download Python distribution artifact
        uses: actions/download-artifact@v8
        with:
          name: nymeria-python-dist
          path: Nymeria/dist

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v8
        with:
          name: nymeria-windows-installer
          path: desktop-dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=(--title "$GITHUB_REF_NAME" --generate-notes)
          if [[ "$GITHUB_REF_NAME" =~ (alpha|beta|rc) ]]; then
            release_args+=(--prerelease)
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" Nymeria/dist/*.whl Nymeria/dist/*.tar.gz desktop-dist/*.exe --clobber
          else
            gh release create "$GITHUB_REF_NAME" Nymeria/dist/*.whl Nymeria/dist/*.tar.gz desktop-dist/*.exe "${release_args[@]}"
          fi

  private-python-index:
    name: Publish private Python index
    needs: python-package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download Python distribution artifact
        uses: actions/download-artifact@v8
        with:
          name: nymeria-python-dist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Twine
        # Pinned below 6.1: twine 6.1+ refuses --skip-existing against
        # repositories it does not recognize as Warehouse-like, which
        # includes pypiserver-style private indexes (verified 2026-07-17:
        # 6.x latest fails with UnsupportedConfiguration, 6.0.1 uploads and
        # skips duplicates correctly).
        run: python -m pip install --upgrade pip "twine==6.0.1"

      - name: Publish to private Python index
        env:
          TWINE_REPOSITORY_URL: ${{ secrets.NYMERIA_PYPI_REPOSITORY_URL }}
          TWINE_USERNAME: ${{ secrets.NYMERIA_PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.NYMERIA_PYPI_PASSWORD }}
        run: |
          missing=()
          [[ -z "$TWINE_REPOSITORY_URL" ]] && missing+=(NYMERIA_PYPI_REPOSITORY_URL)
          [[ -z "$TWINE_USERNAME" ]] && missing+=(NYMERIA_PYPI_USERNAME)
          [[ -z "$TWINE_PASSWORD" ]] && missing+=(NYMERIA_PYPI_PASSWORD)

          if (( ${#missing[@]} > 0 )); then
            echo "Private Python index publish skipped; missing secrets: ${missing[*]}"
            {
              echo "### Private Python index"
              echo
              echo "Skipped publishing because these repository secrets are missing:"
              printf -- "- \`%s\`\n" "${missing[@]}"
              echo
              echo "Set the three NYMERIA_PYPI_* repository secrets to enable Twine publishing (see docs/deployment/release-workflow.md)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python -m twine upload --non-interactive --skip-existing --repository-url "$TWINE_REPOSITORY_URL" dist/*.whl dist/*.tar.gz
          {
            echo "### Private Python index"
            echo
            echo "Published Nymeria Python distributions with Twine."
          } >> "$GITHUB_STEP_SUMMARY"

  pypi-publish:
    name: Publish to public PyPI
    # Opt-in and tag-only: uploads to public PyPI (pypi.org) only when the repo
    # variable PUBLISH_PYPI is "true" AND this is a v* tag build. Stays dormant
    # otherwise, so turning it on is a single repo-variable flip with no code
    # change (mirrors the docker-images PUBLISH_IMAGES gate). Independent of the
    # private-index job above; you can run either, both, or neither.
    #
    # Tokenless OIDC (Trusted Publishing): there are NO secrets to store. One
    # time setup before flipping the variable (see docs/deployment/release-workflow.md):
    #   1. On PyPI: project nymeriaos -> Manage -> Publishing -> add a GitHub
    #      Trusted Publisher with owner/repo = this repository, workflow file
    #      name = "release.yml", and environment name = "pypi".
    #   2. On GitHub: Settings -> Environments -> create "pypi" (optionally add a
    #      protection rule limiting it to v* tags / a release approver).
    # The project name nymeriaos must also be registered/owned on pypi.org.
    needs: python-package
    if: ${{ vars.PUBLISH_PYPI == 'true' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/nymeriaos
    # id-token: write is mandatory for trusted publishing. A job-level
    # permissions block replaces the workflow default for this job, and OIDC is
    # the only elevated scope required: downloading a same-run artifact works
    # with the default token, so no contents/actions scope is needed here.
    permissions:
      id-token: write

    steps:
      - name: Download Python distribution artifact
        uses: actions/download-artifact@v8
        with:
          # Reuse the exact wheel + sdist that passed `twine check` in the
          # python-package job rather than rebuilding (and re-bundling the
          # frontend). The artifact is flattened to its dist/ root, so the files
          # land at dist/*.whl and dist/*.tar.gz.
          name: nymeria-python-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # packages-dir defaults to dist/ (the two files downloaded above).
          # skip-existing keeps re-runs of an already-published tag idempotent;
          # PEP 740 attestations are generated by default under id-token: write.
          skip-existing: true
          print-hash: true

  docker-images:
    name: Build and publish container images
    # Opt-in: only runs when the repo variable PUBLISH_IMAGES is "true", or on a
    # manual workflow_dispatch (build-only smoke test). This keeps the heavy
    # image builds off normal tag pushes since Actions minutes are paid here.
    if: ${{ vars.PUBLISH_IMAGES == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      # Image namespace is overridable via a repo/org variable so this works on
      # the current private repo today and flips to a public repo with no code
      # change. Defaults to ghcr.io/<owner>.
      IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE || format('ghcr.io/{0}', github.repository_owner) }}
      # Push only when publishing is enabled AND this is a tag build. Manual
      # dispatch (or PUBLISH_IMAGES unset) builds without pushing.
      SHOULD_PUSH: ${{ vars.PUBLISH_IMAGES == 'true' && startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: nymeria-full
            dockerfile: Dockerfile.full
          - image: nymeria-slim
            dockerfile: Dockerfile.slim
          - image: nymeria-single
            dockerfile: Dockerfile.single

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install desktop dependencies
        working-directory: nymeria-desktop
        run: npm install

      - name: Build desktop frontend
        working-directory: nymeria-desktop
        run: npm run build

      - name: Bundle frontend into Python package
        run: |
          rm -rf Nymeria/nymeria/frontend
          mkdir -p Nymeria/nymeria/frontend
          cp -a nymeria-desktop/build/. Nymeria/nymeria/frontend/
          test -f Nymeria/nymeria/frontend/index.html
          test -d Nymeria/nymeria/frontend/_app

      - name: Normalize image namespace (GHCR requires lowercase)
        id: ns
        run: echo "value=$(echo "$IMAGE_NAMESPACE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: tags
        run: |
          base="${{ steps.ns.outputs.value }}/${{ matrix.image }}"
          tags="${base}:latest"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            tags="${base}:${version},${tags}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: Nymeria
          file: Nymeria/${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ env.SHOULD_PUSH == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}

      - name: Build-only notice
        if: env.SHOULD_PUSH != 'true'
        run: |
          {
            echo "### Container image: ${{ matrix.image }}"
            echo
            echo "Built but not pushed. To publish, set the repo variable"
            echo "\`PUBLISH_IMAGES=true\` (and optionally \`IMAGE_NAMESPACE\`) and push a \`v*\` tag."
          } >> "$GITHUB_STEP_SUMMARY"
