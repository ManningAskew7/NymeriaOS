[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nymeriaos"
dynamic = ["version"]
description = "Personal AI assistant platform built on LangGraph, FastAPI, and local-first persistence."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Manning Askew", email = "160990142+ManningAskew7@users.noreply.github.com" },
]
keywords = ["ai-assistant", "langgraph", "fastapi", "mcp", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Chat",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  # LangChain/LangGraph tool-call adapter stack. Keep exact pins in sync with
  # requirements*.txt and update deliberately with tool-call smoke tests.
  "langchain==1.3.1",
  "langchain-core==1.4.0",
  "langchain-openai==1.2.1",
  "langchain-anthropic==1.4.3",
  # Tier 1 partner packages with native reasoning round-trip. Keep in sync
  # with requirements.txt; see docs/chat_completions_providers.md.
  "langchain-google-genai==4.1.2",
  "langchain-aws==1.4.6",
  "langchain-ollama==1.1.0",
  "langchain-classic==1.0.7",
  "langchain-community==0.4.1",
  "langchain-protocol==0.0.15",
  "langchain-text-splitters==1.1.2",
  "langgraph==1.2.0",
  "langgraph-prebuilt==1.1.0",
  "langgraph-checkpoint==4.1.0",
  "langgraph-sdk==0.3.14",
  "langgraph-checkpoint-sqlite==3.1.0",
  "anthropic==0.102.0",
  "openai==2.37.0",
  "aiosqlite>=0.22.1,<1.0.0",
  "sqlite-vec>=0.1.9,<1.0.0",
  "fastapi>=0.136.1,<1.0.0",
  "starlette>=1.0.0,<2.0.0",
  "uvicorn[standard]>=0.32.0,<1.0.0",
  "sse-starlette>=2.1.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.1,<1.0.0",
  "requests>=2.34.2,<3.0.0",
  "urllib3>=2.2.2,<3.0.0",
  "python-dateutil>=2.9.0,<3.0.0",
  "wikipedia>=1.4.0",
  "wolframalpha>=5.0.0",
  "PyYAML>=6.0.3",
  "python-multipart>=0.0.12",
  "rich>=13.9.0",
  "markdown-it-py>=3.0.0",
  "prompt_toolkit>=3.0.0",
  "textual>=0.80.0",
  "Jinja2>=3.1.6,<4.0.0",
  "Pillow>=10.4.0,<13.0.0",
  "qrcode>=8.0,<9.0",
  "mcp>=1.2.0",
  # Chat-platform bot SDKs are NOT in core. They install via per-platform extras
  # (nymeriaos[discord], nymeriaos[telegram], ...) so a default install stays lean.
  # The full Docker image pulls them via requirements-bots.txt.
  "cryptography>=42.0.0",
  "PyJWT>=2.8.0",
  "google-api-python-client>=2.100.0",
  "google-auth>=2.23.0",
  "google-auth-oauthlib>=1.1.0",
  "google-genai>=1.0.0",
  "pydub>=0.25.1",
  # Edge TTS (free, keyless hosted voice; tiny pure-python client). Promoted to
  # core alongside requirements.txt so default installs can speak with no extra.
  "edge-tts>=7.0.0",
  "openpyxl>=3.1.0",
  # Document extraction for email/file attachments (lazy-imported in
  # core/attachment_sandbox.py). Small pure-Python deps, kept in core so the
  # default attachment path works on a lean install.
  "pypdf>=4.0.0",
  "python-docx>=1.1.0",
  "feedparser>=6.0.0",
  # Web page fetch + content extraction (fetch_url_nymeria). Trafilatura is the
  # primary article extractor; readability-lxml + markdownify are the fallback.
  "trafilatura>=1.12.0",
  "readability-lxml>=0.8.1",
  "lxml>=5.0.0",
  "markdownify>=0.13.0",
  # Keyless in-process web metasearch (web_search_ddgs). Kept in core so the
  # quickstart default search path works on a lean install with no key.
  "ddgs>=9.14.0,<10.0.0",
]

[project.optional-dependencies]
postgres = [
  "langgraph-checkpoint-postgres==3.1.0",
  "psycopg[binary]>=3.3.4,<4.0.0",
  "psycopg-pool>=3.3.1,<4.0.0",
]
redis = [
  "redis>=5.0.0",
]
voice = [
  "pydub>=0.25.1",
  "edge-tts>=7.0.0",
]
# In-process local voice engines (TTS_PROVIDER=kokoro / STT_PROVIDER=faster-whisper
# with no base URL set). CPU-friendly; model weights download on first use.
# faster-whisper bundles PyAV, which also provides the no-ffmpeg Ogg/Opus encode
# for voice notes (core/voice_local.py).
voice-local = [
  "kokoro-onnx>=0.5.0",
  "faster-whisper>=1.2.0",
]
browser = [
  "playwright",
  "beautifulsoup4",
]
firebase = [
  "firebase-admin>=6.0.0",
]
# Local, on-device RAG: the in-process embedder (e.g. granite) and cross-encoder
# reranker (e.g. Ettin) run via sentence-transformers (which pulls torch). Needed
# only for EMBEDDING_PROVIDER=local and RAG_RERANK_PROVIDER=local. The int8 ONNX
# reranker path (RAG_RERANK_LOCAL_ONNX_FILE) additionally needs optimum[onnxruntime].
local-rag = [
  "sentence-transformers>=3.0.0",
]
# Chat-platform bots. Install only the platforms you use, e.g.
# pip install "nymeriaos[discord]" or "nymeriaos[bots]" for all of them.
discord = [
  "discord.py>=2.3.0",
]
telegram = [
  "python-telegram-bot[rate-limiter]>=22.0",
]
slack = [
  "slack-bolt>=1.22.0",
  "slack-sdk>=3.35.0",
]
mattermost = [
  "websockets>=12.0",
]
rocketchat = [
  "websockets>=12.0",
]
# matrix/zulip/signal talk to their servers over httpx (already in core), so
# these extras carry no extra deps. They exist so install commands and docs can
# reference nymeria[<platform>] uniformly across every chat platform.
matrix = []
zulip = []
signal = []
bots = [
  "discord.py>=2.3.0",
  "python-telegram-bot[rate-limiter]>=22.0",
  "slack-bolt>=1.22.0",
  "slack-sdk>=3.35.0",
  "websockets>=12.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=7.0.0",
  "pytest-asyncio>=0.26.0",
  "pytest-timeout>=2.3.0",
  "pytest-xdist>=3.5.0",
  "ruff>=0.15.0",
  "pyrefly>=1.0.0",
]
all = [
  "langgraph-checkpoint-postgres==3.1.0",
  "psycopg[binary]>=3.3.4,<4.0.0",
  "psycopg-pool>=3.3.1,<4.0.0",
  "redis>=5.0.0",
  "pydub>=0.25.1",
  "playwright",
  "beautifulsoup4",
  "firebase-admin>=6.0.0",
  # local on-device RAG (embedder + reranker)
  "sentence-transformers>=3.0.0",
  # bots
  "discord.py>=2.3.0",
  "python-telegram-bot[rate-limiter]>=22.0",
  "slack-bolt>=1.22.0",
  "slack-sdk>=3.35.0",
  "websockets>=12.0",
  "pytest>=8.0.0",
  "pytest-cov>=7.0.0",
  "pytest-asyncio>=0.26.0",
  "pytest-timeout>=2.3.0",
  "pytest-xdist>=3.5.0",
  "ruff>=0.15.0",
  "pyrefly>=1.0.0",
]

[project.scripts]
nymeria = "nymeria.cli_entry:main"

[project.urls]
Homepage = "https://github.com/ManningAskew7/NymeriaOS"
Repository = "https://github.com/ManningAskew7/NymeriaOS"
Documentation = "https://github.com/ManningAskew7/NymeriaOS/tree/main/Nymeria/docs"

[tool.setuptools.dynamic]
version = { attr = "nymeria.__version__" }

[tool.setuptools]
py-modules = ["run"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nymeria", "nymeria.*"]

[tool.setuptools.package-data]
nymeria = [
  "agents/*.md",
  "config/*.md",
  "config/data/*.json",
  "frontend/**/*",
  # Clone-free Docker: the published-image compose finalize materializes into
  # the runtime root (kept byte-identical to Nymeria/docker-compose.single.
  # published.yml by a drift test).
  "setup/assets/*.yml",
  "skills_bundled/*/SKILL.md",
  "triggers/**/*.md",
  "vendor/react_agent/*.md",
]

[tool.pyrefly]
project-includes = ["nymeria/**/*.py"]
project-excludes = [
    "nymeria/vendor/**",
    "nymeria/skills_bundled/**",
    "**/__pycache__/**",
    "**/.venv/**",
    "**/build/**",
    "**/dist/**",
]
python-version = "3.11"
replace-imports-with-any = [
    "boto3",
    "boto3.*",
    "botocore",
    "botocore.*",
    "bs4",
    "firebase_admin",
    "firebase_admin.*",
    "playwright",
    "playwright.*",
    "redis",
    "redis.*",
    "slack_bolt",
    "slack_bolt.*",
    "slack_sdk",
    "slack_sdk.*",
    "langchain_community",
    "langchain_community.*",
    # Chat-platform bot SDKs live in optional extras and may be absent from the
    # lint environment once core no longer pulls them.
    "discord",
    "discord.*",
    "telegram",
    "telegram.*",
    "websockets",
    "websockets.*",
    # Web page fetch + content extraction libs (lazy-imported in tools/web_fetch.py).
    "trafilatura",
    "trafilatura.*",
    "readability",
    "readability.*",
    "markdownify",
    # Local rerank / embeddings extra (lazy-imported in core/rag_quality.py and
    # core/memory_index.py); absent unless the local-rag extra is installed.
    "sentence_transformers",
    "sentence_transformers.*",
]

[tool.pyrefly.errors]
bad-function-definition = false

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
asyncio_mode = "strict"
xfail_strict = true
timeout = 30
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks tests requiring external services",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
source = ["nymeria"]

[tool.coverage.report]
show_missing = true
skip_covered = false
