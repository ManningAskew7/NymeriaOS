# Nymeria Docker Compose Configuration
# Kali Linux deployment with bind-mounted code for live sync
#
# Usage:
#   Start:    docker compose --env-file .env.docker up -d
#   Rebuild:  docker compose --env-file .env.docker up -d --build
#   Logs:     docker compose --env-file .env.docker logs -f
#   Stop:     docker compose --env-file .env.docker down

services:
  # ============================================================================
  # Infrastructure
  # ============================================================================

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: nymeria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nymeria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-nymeria}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nymeria}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nymeria-network

  # Redis Event Bus
  redis:
    image: redis:7-alpine
    container_name: nymeria-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nymeria-network

  # ============================================================================
  # Nymeria Services (Kali Linux)
  # ============================================================================

  api:
    build:
      context: .
      dockerfile: Dockerfile.full
    container_name: nymeria-api
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "${API_PORT:-8000}:8000"
    environment: &api-env
      # Required
      NYMERIA_API_KEY: ${NYMERIA_API_KEY:?NYMERIA_API_KEY is required}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # LLM Configuration
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-20250514}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-1.0}
      # Database
      DATABASE_BACKEND: postgres
      POSTGRES_URI: postgresql://${POSTGRES_USER:-nymeria}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nymeria}
      # Redis
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379
      # Data directory
      NYMERIA_DATA_DIR: /data
      NYMERIA_WORKSPACE_DIR: /workspace
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # Optional
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_DEFAULT_CHAT_ID: ${TELEGRAM_DEFAULT_CHAT_ID:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
    volumes:
      - nymeria_data:/data
      - nymeria_workspace:/workspace
      - ./nymeria:/app/nymeria        # Bind mount: live code sync
      - ./run.py:/app/run.py          # Bind mount: live entry point
      - ./.env.docker:/app/.env.docker  # Bind mount: settings persist across restarts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - nymeria-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile.full
    container_name: nymeria-worker
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: ["python", "run.py", "worker"]
    environment: &worker-env
      NYMERIA_API_KEY: ${NYMERIA_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-20250514}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-1.0}
      DATABASE_BACKEND: postgres
      POSTGRES_URI: postgresql://${POSTGRES_USER:-nymeria}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nymeria}
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379
      NYMERIA_DATA_DIR: /data
      NYMERIA_WORKSPACE_DIR: /workspace
      WORKER_MODE: "true"
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      TICKER_POLL_INTERVAL: ${TICKER_POLL_INTERVAL:-5}
      WATCHDOG_ENABLED: ${WATCHDOG_ENABLED:-true}
      WATCHDOG_INTERVAL_MINUTES: ${WATCHDOG_INTERVAL_MINUTES:-30}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_DEFAULT_CHAT_ID: ${TELEGRAM_DEFAULT_CHAT_ID:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    volumes:
      - nymeria_data:/data
      - nymeria_workspace:/workspace
      - ./nymeria:/app/nymeria        # Bind mount: live code sync
      - ./run.py:/app/run.py          # Bind mount: live entry point
      - ./.env.docker:/app/.env.docker  # Bind mount: settings persist across restarts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "run.py worker"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - nymeria-network

  # Discord Bot for two-way communication
  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile.full
    container_name: nymeria-discord-bot
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: ["python", "run.py", "discord-bot"]
    profiles:
      - discord  # Only starts when explicitly enabled: docker compose --profile discord up -d
    environment:
      <<: *worker-env
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?DISCORD_BOT_TOKEN is required for discord-bot service}
      DISCORD_MODE: ${DISCORD_MODE:-gateway}
      DISCORD_RESPOND_MODE: ${DISCORD_RESPOND_MODE:-mention}
    volumes:
      - nymeria_data:/data
      - nymeria_workspace:/workspace
      - ./nymeria:/app/nymeria
      - ./run.py:/app/run.py
      - ./.env.docker:/app/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "run.py discord-bot"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - nymeria-network

  # MCP Server for agent-to-agent communication
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.full
    container_name: nymeria-mcp
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: ["python", "run.py", "mcp", "--http", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "${MCP_PORT:-8001}:8001"
    environment:
      <<: *api-env
    volumes:
      - nymeria_data:/data
      - nymeria_workspace:/workspace
      - ./nymeria:/app/nymeria        # Bind mount: live code sync
      - ./run.py:/app/run.py          # Bind mount: live entry point
      - ./.env.docker:/app/.env.docker  # Bind mount: settings persist across restarts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "run.py mcp"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - nymeria-network

# ============================================================================
# Volumes
# ============================================================================

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nymeria_data:
    driver: local
  nymeria_workspace:
    driver: local

# ============================================================================
# Networks
# ============================================================================

networks:
  nymeria-network:
    driver: bridge
