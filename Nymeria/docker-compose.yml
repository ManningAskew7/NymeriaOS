              count: 1
              capabilities: [gpu]
    environment:
      WHISPER__MODEL: ${STT_MODEL:-large-v3-turbo}
    volumes:
      - whisper_models:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - edge

  # SearXNG - self-hosted, keyless metasearch backing the web_search_searxng
  # tool. Behind the `search` profile, so it only starts when explicitly
  # enabled (the tool itself is opt-in per thread):
  #   docker compose --profile search --env-file .env.docker up -d searxng
  # Internal-only: no host port is published; the API reaches it at
  # http://searxng:8080 on the edge network. JSON output (which the tool
  # requires) is enabled in ./searxng/settings.yml. Pin a digest for production.
  searxng:
    image: searxng/searxng:latest
    container_name: nymeria-searxng
    restart: unless-stopped
    profiles:
      - search
    # SearXNG's entrypoint chowns its config and drops to an unprivileged uid,
    # so it needs these three caps back on top of the cap_drop ALL baseline.
    # no-new-privileges is intentionally NOT set here (it can break the
    # entrypoint's privilege drop); the matching upstream searxng-docker setup
    # relies on the same cap_drop/cap_add posture.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.75
    pids_limit: 128
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      # Signs the web UI's cookies/CSRF tokens; substituted into settings.yml at
      # startup. Change it for any non-local deployment.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-nymeria-searxng-internal-change-me}
      SEARXNG_UWSGI_WORKERS: ${SEARXNG_WORKERS:-2}
      SEARXNG_UWSGI_THREADS: ${SEARXNG_THREADS:-2}
    volumes:
      - ./searxng:/etc/searxng:rw
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks:
      - edge

# ============================================================================
# Volumes
# ============================================================================

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nymeria_data:
    driver: local
  nymeria_workspace:
    driver: local
  # Caddy persists auto-issued TLS certs (and ACME account state) in /data
  # so they survive container restarts and image rebuilds; losing this
  # volume forces Let's Encrypt re-issuance and may hit rate limits.
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  qwen3_tts_models:
    driver: local
  whisper_models:
    driver: local

# ============================================================================
# Networks
# ============================================================================

networks:
  # Edge network: the proxy + everything the proxy reaches (api, mcp) plus
  # the chat bots / worker / watchdog that need outbound network and api
  # access. Reachable from caddy on 80/443.
  edge:
    driver: bridge
  # Backend network: data plane only. Postgres and Redis live here, plus
  # the services that legitimately speak SQL/RESP (api, worker).
  # Chat bots and mcp are intentionally NOT on backend; a compromised
  # bot can call the api over HTTP but cannot touch the database directly.
  backend:
    driver: bridge
