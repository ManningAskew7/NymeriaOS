# Nymeria Docker Compose Configuration
# Kali Linux deployment with bind-mounted code for live sync
#
# Usage:
#   Start:    docker compose --env-file .env.docker up -d
#   Rebuild:  docker compose --env-file .env.docker up -d --build
#   Logs:     docker compose --env-file .env.docker logs -f
#   Stop:     docker compose --env-file .env.docker down

x-security-hardening: &security-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# Filesystem hardening for full-runtime containers (api/worker). The API owns
# the NymeriaAgent runtime; the worker relays scheduled turns to the API but
# currently shares the full image and writable workspace/cache posture. Both
# still run as the Dockerfile's non-root `nymeria` user with cap_drop ALL +
# no-new-privileges. Runtime system package installation is intentionally not
# supported in the production compose profile.
x-agent-fs: &agent-fs
  tmpfs:
    - /tmp

# Filesystem hardening for THIN-CLIENT containers (watchdog, mcp, bots,
# caddy). These talk to the API over HTTP and never need to write to the
# rootfs. Locking them down prevents an attacker who compromises a chat
# integration from persisting a backdoor inside the container image layer.
x-thin-client-fs: &thin-client-fs
  read_only: true
  tmpfs:
    - /tmp
    - /home/nymeria

# Resource limits. Tuned for a 2GB / 1 vCPU droplet running the core
# services plus a couple of optional bots. The sum overcommits the host
# on purpose; limits are caps, not reservations, and most services idle
# well under their headroom. Per-container PID limits cap fork-bomb-style
# blast radius from a compromised tool call.
x-limits-full: &limits-full
  mem_limit: 1536m
  memswap_limit: 1536m
  cpus: 1.5
  pids_limit: 256

x-limits-slim: &limits-slim
  mem_limit: 384m
  memswap_limit: 384m
  cpus: 0.5
  pids_limit: 128

x-limits-infra: &limits-infra
  mem_limit: 256m
  memswap_limit: 256m
  cpus: 0.5
  pids_limit: 64

x-nymeria-full-image: &nymeria-full-image
  image: nymeria-full:local
  build:
    context: .
    dockerfile: Dockerfile.full

x-nymeria-slim-image: &nymeria-slim-image
  image: nymeria-slim:local
  build:
    context: .
    dockerfile: Dockerfile.slim

x-thin-client-env: &thin-client-env
  TZ: ${USER_TIMEZONE:-UTC}
  NYMERIA_SERVICE_TOKEN: ${NYMERIA_SERVICE_TOKEN:-}
  NYMERIA_DATA_DIR: /data
  USER_TIMEZONE: ${USER_TIMEZONE:-UTC}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_PROFILES: ${LOG_PROFILES:-}
  LOG_MODULES: ${LOG_MODULES:-}

services:
  # ============================================================================
  # Infrastructure
  # ============================================================================

  # PostgreSQL Database
  postgres:
    <<: [*security-hardening, *limits-infra]
    # Digest pinned 2026-05-17. Bump via scripts/update-image-digests.sh.
    image: postgres:15-alpine@sha256:df7bca0066e6f60cc3dd32faa70caddec20e2c22b58932f79498e5704b23854a
    container_name: nymeria-postgres
    restart: unless-stopped
    user: postgres
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nymeria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-nymeria}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nymeria}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # Redis Event Bus
  redis:
    <<: [*security-hardening, *limits-infra]
    # Digest pinned 2026-05-17. Bump via scripts/update-image-digests.sh.
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: nymeria-redis
    restart: unless-stopped
    user: redis
    read_only: true
    tmpfs:
      - /tmp
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ============================================================================
  # Reverse Proxy
  # ============================================================================

  # Caddy fronts the public internet. Terminates TLS via Let's Encrypt
  # (set NYMERIA_HOSTNAME + ACME_EMAIL in .env.docker), proxies to api on
  # /, /api/* and /mcp/* to mcp. The api and mcp containers expose their
  # ports on 127.0.0.1 only; Caddy is the only externally-reachable
  # service on the host. UFW should accept 80 and 443 and deny 8000/8001.
  caddy:
    <<: [*security-hardening, *thin-client-fs, *limits-slim]
    # Digest pinned 2026-05-17. Bump via scripts/update-image-digests.sh.
    image: caddy:2-alpine@sha256:86deaf5e3d3408a6ccec08fbb79989783dd26e206ae10bcf78a801dc8c9ab794
    container_name: nymeria-caddy
    restart: unless-stopped
    # NET_BIND_SERVICE is the one Linux capability a reverse proxy
    # legitimately needs that the cap_drop: ALL baseline strips. Without
    # it the caddy process (even as root inside the image) cannot bind to
    # ports 80/443. This is the standard production pattern.
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
    environment:
      NYMERIA_HOSTNAME: ${NYMERIA_HOSTNAME:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # auto-issued certs + ACME account state
      - caddy_config:/config   # Caddy's own runtime config snapshots
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Hit the proxy itself on :80; passes if Caddy is serving and
      # successfully proxying to api (which has its own /health).
      test: ["CMD", "wget", "-qO-", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - edge

  # ============================================================================
  # Nymeria Services (Kali Linux)
  # ============================================================================

  api:
    <<: [*security-hardening, *agent-fs, *limits-full, *nymeria-full-image]
    container_name: nymeria-api
    restart: unless-stopped
    # PID 1 reaper so MCP subprocess grandchildren (node, etc.) don't zombify.
    init: true
    # Full-runtime API container: runs as the Dockerfile's non-root `nymeria`
    # user. cap_drop ALL + no-new-privileges is the production boundary;
    # runtime apt/dpkg installs are intentionally not available here.
    # OAuth token caches are now per-user at /data/auth_tokens/<user_id>/
    # (see docs/accounts.md). Existing global caches in /data/auth_tokens/
    # get migrated to /data/auth_tokens/default/ by the agent at boot.
    command: ["python", "run.py", "api"]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # Allow containers to reach services running on the host (e.g. local LLM
    # inference servers like llama-server). The host-gateway magic value works
    # on Docker Desktop (Win/Mac) AND Linux Docker.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # API is fronted by Caddy on :443. We still bind 8000 on the host but
    # only on the loopback interface so it's reachable via SSH tunnel for
    # local development without being exposed to the public internet.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment: &api-env
      # System timezone (matches USER_TIMEZONE for consistent bash/OS time)
      TZ: ${USER_TIMEZONE:-UTC}
      # Required
      # NYMERIA_API_KEY is deprecated; authentication is per-user account
      # tokens only. Passed through if set (silently ignored by the server)
      # so existing .env.docker values don't break compose validation.
      NYMERIA_API_KEY: ${NYMERIA_API_KEY:-}
      NYMERIA_SERVICE_TOKEN: ${NYMERIA_SERVICE_TOKEN:-}
      NYMERIA_SECRETS_KEY: ${NYMERIA_SECRETS_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      MICROSOFT_MCP_CLIENT_ID: ${MICROSOFT_MCP_CLIENT_ID:-}
      # LLM Configuration
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-6}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-1.0}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-}
      LLM_EXTENDED_THINKING: ${LLM_EXTENDED_THINKING:-false}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      LLM_USE_MODEL_DEFAULTS: ${LLM_USE_MODEL_DEFAULTS:-false}
      OPENAI_API_MODE: ${OPENAI_API_MODE:-responses}
      LLM_STREAM_MAX_RETRIES: ${LLM_STREAM_MAX_RETRIES:-2}
      LLM_STREAM_RETRY_INITIAL_DELAY: ${LLM_STREAM_RETRY_INITIAL_DELAY:-1.0}
      LLM_STREAM_RETRY_MAX_DELAY: ${LLM_STREAM_RETRY_MAX_DELAY:-8.0}
      # Database
      DATABASE_BACKEND: postgres
      POSTGRES_URI: postgresql://${POSTGRES_USER:-nymeria}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nymeria}
      # Redis
      REDIS_ENABLED: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      # Data directory
      NYMERIA_DATA_DIR: /data
      NYMERIA_WORKSPACE_DIR: /workspace
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:1420,tauri://localhost,http://tauri.localhost,https://tauri.localhost,http://localhost:8000}
      # User preferences
      USER_TIMEZONE: ${USER_TIMEZONE:-UTC}
      # Context management
      CONTEXT_MANAGEMENT: ${CONTEXT_MANAGEMENT:-auto_compact}
      COMPACT_THRESHOLD: ${COMPACT_THRESHOLD:-0.8}
      COMPACT_KEEP_MESSAGES: ${COMPACT_KEEP_MESSAGES:-4}
      COMPACT_MODEL: ${COMPACT_MODEL:-}
      TOOL_OUTPUT_MAX_CHARS: ${TOOL_OUTPUT_MAX_CHARS:-100000}
      # Scheduler & autonomy
      TICKER_POLL_INTERVAL: ${TICKER_POLL_INTERVAL:-5}
      MAX_CONCURRENT_AUTONOMOUS: ${MAX_CONCURRENT_AUTONOMOUS:-5}
      WATCHDOG_ENABLED: ${WATCHDOG_ENABLED:-true}
      WATCHDOG_INTERVAL_MINUTES: ${WATCHDOG_INTERVAL_MINUTES:-5}
      TODO_STALENESS_MINUTES: ${TODO_STALENESS_MINUTES:-20}
      ACTIVITY_RETENTION_HOURS: ${ACTIVITY_RETENTION_HOURS:-12}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_PROFILES: ${LOG_PROFILES:-}
      LOG_MODULES: ${LOG_MODULES:-}
      # Optional integrations
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      PERPLEXITY_SEARCH_MODEL: ${PERPLEXITY_SEARCH_MODEL:-sonar-pro}
      # SearXNG metasearch for web_search_searxng. Defaults to the bundled
      # `searxng` sidecar (start it with the `search` compose profile). The
      # other web-search providers (Tavily/Exa/Firecrawl/Brave) use API keys via
      # the credential vault and are intentionally not passed through here.
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_EXTRACTION_MODEL: ${GEMINI_EXTRACTION_MODEL:-gemini-3-flash-preview}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_DEFAULT_CHAT_ID: ${TELEGRAM_DEFAULT_CHAT_ID:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_RESPOND_MODE: ${SLACK_RESPOND_MODE:-mention}
      SLACK_SHOW_TOOL_EVENTS: ${SLACK_SHOW_TOOL_EVENTS:-false}
      MATRIX_HOMESERVER: ${MATRIX_HOMESERVER:-}
      MATRIX_ACCESS_TOKEN: ${MATRIX_ACCESS_TOKEN:-}
      MATRIX_USER_ID: ${MATRIX_USER_ID:-}
      MATRIX_PASSWORD: ${MATRIX_PASSWORD:-}
      MATRIX_DEVICE_ID: ${MATRIX_DEVICE_ID:-}
      MATRIX_RESPOND_MODE: ${MATRIX_RESPOND_MODE:-mention}
      MATRIX_FREE_RESPONSE_ROOMS: ${MATRIX_FREE_RESPONSE_ROOMS:-}
      MATRIX_AUTO_JOIN: ${MATRIX_AUTO_JOIN:-false}
      WEBEX_ACCESS_TOKEN: ${WEBEX_ACCESS_TOKEN:-}
      WEBEX_BASE_URL: ${WEBEX_BASE_URL:-https://webexapis.com/v1}
      WEBEX_WEBHOOK_SECRET: ${WEBEX_WEBHOOK_SECRET:-}
      WEBEX_BOT_PERSON_ID: ${WEBEX_BOT_PERSON_ID:-}
      WEBEX_BOT_EMAIL: ${WEBEX_BOT_EMAIL:-}
      WEBEX_SHOW_TOOL_EVENTS: ${WEBEX_SHOW_TOOL_EVENTS:-false}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_BASE_URL: ${WHATSAPP_BASE_URL:-https://graph.facebook.com/v19.0}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_SHOW_TOOL_EVENTS: ${WHATSAPP_SHOW_TOOL_EVENTS:-false}
      MESSENGER_PAGE_ACCESS_TOKEN: ${MESSENGER_PAGE_ACCESS_TOKEN:-}
      MESSENGER_PAGE_ID: ${MESSENGER_PAGE_ID:-}
      MESSENGER_WEBHOOK_VERIFY_TOKEN: ${MESSENGER_WEBHOOK_VERIFY_TOKEN:-}
      MESSENGER_APP_SECRET: ${MESSENGER_APP_SECRET:-}
      MESSENGER_GRAPH_API_BASE_URL: ${MESSENGER_GRAPH_API_BASE_URL:-https://graph.facebook.com/v23.0}
      MESSENGER_SHOW_TOOL_EVENTS: ${MESSENGER_SHOW_TOOL_EVENTS:-false}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
      INSTAGRAM_IG_USER_ID: ${INSTAGRAM_IG_USER_ID:-}
      INSTAGRAM_WEBHOOK_VERIFY_TOKEN: ${INSTAGRAM_WEBHOOK_VERIFY_TOKEN:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      INSTAGRAM_GRAPH_API_BASE_URL: ${INSTAGRAM_GRAPH_API_BASE_URL:-https://graph.instagram.com/v23.0}
      INSTAGRAM_SHOW_TOOL_EVENTS: ${INSTAGRAM_SHOW_TOOL_EVENTS:-false}
      TEAMS_BOT_APP_ID: ${TEAMS_BOT_APP_ID:-}
      TEAMS_BOT_APP_PASSWORD: ${TEAMS_BOT_APP_PASSWORD:-}
      TEAMS_BOT_TENANT_ID: ${TEAMS_BOT_TENANT_ID:-}
      TEAMS_BOT_RESPOND_MODE: ${TEAMS_BOT_RESPOND_MODE:-mention}
      TEAMS_BOT_VALIDATE_AUTH: ${TEAMS_BOT_VALIDATE_AUTH:-true}
      TEAMS_BOT_SHOW_TOOL_EVENTS: ${TEAMS_BOT_SHOW_TOOL_EVENTS:-false}
      TEAMS_BOT_TOKEN_URL: ${TEAMS_BOT_TOKEN_URL:-https://login.microsoftonline.com/botframework.com/oauth2/v2.0/token}
      TEAMS_BOT_OPENID_CONFIG_URL: ${TEAMS_BOT_OPENID_CONFIG_URL:-https://login.botframework.com/v1/.well-known/openidconfiguration}
      GOOGLE_CHAT_SERVICE_ACCOUNT_JSON: ${GOOGLE_CHAT_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_CHAT_SERVICE_ACCOUNT_FILE: ${GOOGLE_CHAT_SERVICE_ACCOUNT_FILE:-}
      GOOGLE_CHAT_PROJECT_NUMBER: ${GOOGLE_CHAT_PROJECT_NUMBER:-}
      GOOGLE_CHAT_AUTH_AUDIENCE: ${GOOGLE_CHAT_AUTH_AUDIENCE:-}
      GOOGLE_CHAT_AUTH_AUDIENCE_TYPE: ${GOOGLE_CHAT_AUTH_AUDIENCE_TYPE:-app-url}
      GOOGLE_CHAT_BOT_NAME: ${GOOGLE_CHAT_BOT_NAME:-Nymeria}
      GOOGLE_CHAT_RESPOND_MODE: ${GOOGLE_CHAT_RESPOND_MODE:-mention}
      GOOGLE_CHAT_VALIDATE_AUTH: ${GOOGLE_CHAT_VALIDATE_AUTH:-true}
      GOOGLE_CHAT_SHOW_TOOL_EVENTS: ${GOOGLE_CHAT_SHOW_TOOL_EVENTS:-false}
      GOOGLE_CHAT_API_BASE_URL: ${GOOGLE_CHAT_API_BASE_URL:-https://chat.googleapis.com/v1}
      GOOGLE_CHAT_USE_ADC: ${GOOGLE_CHAT_USE_ADC:-false}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LINE_BOT_USER_ID: ${LINE_BOT_USER_ID:-}
      LINE_BOT_NAME: ${LINE_BOT_NAME:-Nymeria}
      LINE_RESPOND_MODE: ${LINE_RESPOND_MODE:-mention}
      LINE_VALIDATE_SIGNATURE: ${LINE_VALIDATE_SIGNATURE:-true}
      LINE_SHOW_TOOL_EVENTS: ${LINE_SHOW_TOOL_EVENTS:-false}
      LINE_API_BASE_URL: ${LINE_API_BASE_URL:-https://api.line.me/v2/bot}
      SIGNAL_HTTP_URL: ${SIGNAL_HTTP_URL:-}
      SIGNAL_ACCOUNT: ${SIGNAL_ACCOUNT:-}
      SIGNAL_ACCOUNT_UUID: ${SIGNAL_ACCOUNT_UUID:-}
      SIGNAL_RESPOND_MODE: ${SIGNAL_RESPOND_MODE:-mention}
      SIGNAL_ALLOWED_USERS: ${SIGNAL_ALLOWED_USERS:-}
      SIGNAL_ALLOWED_GROUPS: ${SIGNAL_ALLOWED_GROUPS:-}
      SIGNAL_SHOW_TOOL_EVENTS: ${SIGNAL_SHOW_TOOL_EVENTS:-false}
      SIGNAL_HTTP_TIMEOUT: ${SIGNAL_HTTP_TIMEOUT:-30.0}
      # Google OAuth
      GOOGLE_OAUTH_CREDENTIALS: ${GOOGLE_OAUTH_CREDENTIALS:-}
      # Microsoft Teams notifications
      TEAMS_TEAM_ID: ${TEAMS_TEAM_ID:-}
      TEAMS_CHANNEL_ID: ${TEAMS_CHANNEL_ID:-}
      TEAMS_ACCOUNT_ID: ${TEAMS_ACCOUNT_ID:-}
      OUTLOOK_DEFAULT_ACCOUNT_ID: ${OUTLOOK_DEFAULT_ACCOUNT_ID:-}
      # Voice (TTS/STT)
      TTS_PROVIDER: ${TTS_PROVIDER:-none}
      TTS_BASE_URL: ${TTS_BASE_URL:-http://qwen3-tts:8000/v1}
      TTS_API_KEY: ${TTS_API_KEY:-}
      TTS_MODEL: ${TTS_MODEL:-Qwen3-TTS-0.6B}
      TTS_VOICE: ${TTS_VOICE:-default}
      TTS_OUTPUT_FORMAT: ${TTS_OUTPUT_FORMAT:-mp3}
      TTS_SPEED: ${TTS_SPEED:-1.0}
      STT_PROVIDER: ${STT_PROVIDER:-none}
      STT_BASE_URL: ${STT_BASE_URL:-http://faster-whisper:8000/v1}
      STT_API_KEY: ${STT_API_KEY:-}
      STT_MODEL: ${STT_MODEL:-large-v3-turbo}
      STT_LANGUAGE: ${STT_LANGUAGE:-}
    volumes:
      - nymeria_data:/data
      - nymeria_workspace:/workspace
      - ./nymeria:/app/nymeria:ro        # Bind mount: live code sync
      - ./tests:/app/tests:ro         # Bind mount: focused backend tests for live validation
      - ./run.py:/app/run.py:ro          # Bind mount: live entry point
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
      - ./google_credentials.json:/app/google_credentials.json:ro  # Google OAuth creds
      - ../nymeria-desktop/build:/app/frontend:ro  # Outlook add-in / web UI frontend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - edge       # reachable by Caddy and bot containers
      - backend    # for postgres + redis access

  worker:
    <<: [*security-hardening, *agent-fs, *limits-full, *nymeria-full-image]
    container_name: nymeria-worker
    restart: unless-stopped
    # PID 1 reaper so MCP subprocess grandchildren (node, etc.) don't zombify.
    init: true
    # See api service for non-root/capability rationale. The worker is a
    # scheduler/trigger relay that invokes the API instead of constructing
    # its own agent.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Legacy /root/<token>.json symlink migration removed; the agent's
    # accounts bootstrap (nymeria/core/accounts.py) now handles legacy
    # auth-token paths and migrates them under /data/auth_tokens/<user_id>/.
    # Required because the container no longer runs as root and /root/ is
    # not writable from uid 999.
    command: ["python", "run.py", "worker"]
    environment:
      <<: *api-env
      WORKER_MODE: "true"
    volumes:
      - nymeria_data:/data
      - nymeria_workspace:/workspace
      - ./nymeria:/app/nymeria:ro        # Bind mount: live code sync
      - ./run.py:/app/run.py:ro          # Bind mount: live entry point
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "nymeria.core.service_health", "check", "worker"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - edge       # for API relay calls and outbound trigger/source access
      - backend    # for Redis events and datastore dependency checks

  # Watchdog thin-client worker (polls API for stale TODOs)
  watchdog:
    <<: [*security-hardening, *thin-client-fs, *limits-slim, *nymeria-slim-image]
    container_name: nymeria-watchdog
    restart: unless-stopped
    command: ["python", "run.py", "watchdog", "--api-url", "http://nymeria-api:8000"]
    environment:
      <<: *thin-client-env
      WATCHDOG_ENABLED: ${WATCHDOG_ENABLED:-true}
      WATCHDOG_INTERVAL_MINUTES: ${WATCHDOG_INTERVAL_MINUTES:-5}
      TODO_STALENESS_MINUTES: ${TODO_STALENESS_MINUTES:-20}
      NYMERIA_WATCHDOG_DISABLED: ${NYMERIA_WATCHDOG_DISABLED:-}
    volumes:
      - nymeria_data:/data                    # for kill-switch file at /data/flags/watchdog-off
      - ./nymeria:/app/nymeria:ro                # Bind mount: live code sync
      - ./run.py:/app/run.py:ro                  # Bind mount: live entry point
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "nymeria.core.service_health", "check", "watchdog", "--api-url", "http://nymeria-api:8000"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - edge

  # Discord Bot for two-way communication
  discord-bot:
