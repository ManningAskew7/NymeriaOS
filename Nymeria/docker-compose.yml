# Nymeria Docker Compose Configuration
# Kali Linux deployment with bind-mounted code for live sync
#
# Usage:
#   Start:    docker compose --env-file .env.docker up -d
#   Rebuild:  docker compose --env-file .env.docker up -d --build
#   Logs:     docker compose --env-file .env.docker logs -f
#   Stop:     docker compose --env-file .env.docker down

x-security-hardening: &security-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  # ============================================================================
  # Infrastructure
  # ============================================================================

  # PostgreSQL Database
  postgres:
    <<: *security-hardening
    image: postgres:15-alpine
    container_name: nymeria-postgres
    restart: unless-stopped
    user: postgres
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nymeria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-nymeria}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nymeria}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nymeria-network

  # Redis Event Bus
  redis:
    <<: *security-hardening
    image: redis:7-alpine
    container_name: nymeria-redis
    restart: unless-stopped
    user: redis
    read_only: true
    tmpfs:
      - /tmp
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nymeria-network

  # ============================================================================
  # Nymeria Services (Kali Linux)
  # ============================================================================

  api:
    <<: *security-hardening
    build:
      context: .
      dockerfile: Dockerfile.full
    container_name: nymeria-api
    restart: unless-stopped
    # PID 1 reaper so MCP subprocess grandchildren (node, etc.) don't zombify.
    init: true
    # OAuth token caches are now per-user at /data/auth_tokens/<user_id>/
    # (see docs/accounts.md). Existing global caches in /data/auth_tokens/
    # get migrated to /data/auth_tokens/default/ by the agent at boot.
    command: ["python", "run.py", "api"]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # Allow containers to reach services running on the host (e.g. local LLM
    # inference servers like llama-server). The host-gateway magic value works
    # on Docker Desktop (Win/Mac) AND Linux Docker.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"
    environment: &api-env
      # System timezone (matches USER_TIMEZONE for consistent bash/OS time)
      TZ: ${USER_TIMEZONE:-UTC}
      # Required
      # NYMERIA_API_KEY is deprecated — authentication is per-user account
      # tokens only. Passed through if set (silently ignored by the server)
      # so existing .env.docker values don't break compose validation.
      NYMERIA_API_KEY: ${NYMERIA_API_KEY:-}
      NYMERIA_SERVICE_TOKEN: ${NYMERIA_SERVICE_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      MICROSOFT_MCP_CLIENT_ID: ${MICROSOFT_MCP_CLIENT_ID:-}
      # LLM Configuration
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-20250514}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-1.0}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-}
      LLM_EXTENDED_THINKING: ${LLM_EXTENDED_THINKING:-false}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      LLM_USE_MODEL_DEFAULTS: ${LLM_USE_MODEL_DEFAULTS:-false}
      OPENAI_API_MODE: ${OPENAI_API_MODE:-responses}
      LLM_STREAM_MAX_RETRIES: ${LLM_STREAM_MAX_RETRIES:-2}
      LLM_STREAM_RETRY_INITIAL_DELAY: ${LLM_STREAM_RETRY_INITIAL_DELAY:-1.0}
      LLM_STREAM_RETRY_MAX_DELAY: ${LLM_STREAM_RETRY_MAX_DELAY:-8.0}
      # Database
      DATABASE_BACKEND: postgres
      POSTGRES_URI: postgresql://${POSTGRES_USER:-nymeria}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nymeria}
      # Redis
      REDIS_ENABLED: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      # Data directory
      NYMERIA_DATA_DIR: /data
      NYMERIA_WORKSPACE_DIR: /workspace
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:1420,tauri://localhost}
      # User preferences
      USER_TIMEZONE: ${USER_TIMEZONE:-UTC}
      # Context management
      CONTEXT_MANAGEMENT: ${CONTEXT_MANAGEMENT:-auto_compact}
      COMPACT_THRESHOLD: ${COMPACT_THRESHOLD:-0.8}
      COMPACT_KEEP_MESSAGES: ${COMPACT_KEEP_MESSAGES:-4}
      COMPACT_MODEL: ${COMPACT_MODEL:-}
      TOOL_OUTPUT_MAX_CHARS: ${TOOL_OUTPUT_MAX_CHARS:-100000}
      # Scheduler & autonomy
      TICKER_POLL_INTERVAL: ${TICKER_POLL_INTERVAL:-5}
      MAX_CONCURRENT_AUTONOMOUS: ${MAX_CONCURRENT_AUTONOMOUS:-5}
      WATCHDOG_ENABLED: ${WATCHDOG_ENABLED:-true}
      WATCHDOG_INTERVAL_MINUTES: ${WATCHDOG_INTERVAL_MINUTES:-5}
      TODO_STALENESS_MINUTES: ${TODO_STALENESS_MINUTES:-20}
      ACTIVITY_RETENTION_HOURS: ${ACTIVITY_RETENTION_HOURS:-12}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_PROFILES: ${LOG_PROFILES:-}
      LOG_MODULES: ${LOG_MODULES:-}
      # Optional integrations
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      PERPLEXITY_SEARCH_MODEL: ${PERPLEXITY_SEARCH_MODEL:-sonar-pro}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_EXTRACTION_MODEL: ${GEMINI_EXTRACTION_MODEL:-gemini-3-flash-preview}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_DEFAULT_CHAT_ID: ${TELEGRAM_DEFAULT_CHAT_ID:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      # Google OAuth
      GOOGLE_OAUTH_CREDENTIALS: ${GOOGLE_OAUTH_CREDENTIALS:-}
      _PRV_A_SERVICE_ACCOUNT_FILE: ${_PRV_A_SERVICE_ACCOUNT_FILE:-}
      # Microsoft Teams notifications
      TEAMS_TEAM_ID: ${TEAMS_TEAM_ID:-}
      TEAMS_CHANNEL_ID: ${TEAMS_CHANNEL_ID:-}
      TEAMS_ACCOUNT_ID: ${TEAMS_ACCOUNT_ID:-}
      OUTLOOK_DEFAULT_ACCOUNT_ID: ${OUTLOOK_DEFAULT_ACCOUNT_ID:-}
      # Voice (TTS/STT)
      TTS_PROVIDER: ${TTS_PROVIDER:-none}
      TTS_BASE_URL: ${TTS_BASE_URL:-http://qwen3-tts:8000/v1}
      TTS_API_KEY: ${TTS_API_KEY:-}
      TTS_MODEL: ${TTS_MODEL:-Qwen3-TTS-0.6B}
      TTS_VOICE: ${TTS_VOICE:-default}
      TTS_OUTPUT_FORMAT: ${TTS_OUTPUT_FORMAT:-mp3}
      TTS_SPEED: ${TTS_SPEED:-1.0}
      STT_PROVIDER: ${STT_PROVIDER:-none}
      STT_BASE_URL: ${STT_BASE_URL:-http://faster-whisper:8000/v1}
      STT_API_KEY: ${STT_API_KEY:-}
      STT_MODEL: ${STT_MODEL:-large-v3-turbo}
      STT_LANGUAGE: ${STT_LANGUAGE:-}
    volumes:
      - nymeria_data:/data
      - nymeria_workspace:/workspace
      - ./nymeria:/app/nymeria        # Bind mount: live code sync
      - ./tests:/app/tests:ro         # Bind mount: focused backend tests for live validation
      - ./run.py:/app/run.py          # Bind mount: live entry point
      - ./.env.docker:/app/.env.docker  # Bind mount: settings persist across restarts
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
      - ./google_credentials.json:/app/google_credentials.json:ro  # Google OAuth creds
      - ../nymeria-desktop/build:/app/frontend:ro  # Outlook add-in / web UI frontend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - nymeria-network

  worker:
    <<: *security-hardening
    build:
      context: .
      dockerfile: Dockerfile.full
    container_name: nymeria-worker
    restart: unless-stopped
    # PID 1 reaper so MCP subprocess grandchildren (node, etc.) don't zombify.
    init: true
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >-
      bash -c "
        mkdir -p /data/auth_tokens &&
        for f in .microsoft_mcp_token_cache.json .google_docs_token_cache.json .google_calendar_token_cache.json; do
          [ ! -f /data/auth_tokens/$$f ] && [ ! -L /root/$$f ] && [ -f /root/$$f ] && mv /root/$$f /data/auth_tokens/$$f;
          [ ! -f /data/auth_tokens/$$f ] && echo '{}' > /data/auth_tokens/$$f;
          ln -sf /data/auth_tokens/$$f /root/$$f;
        done &&
        exec python run.py worker
      "
    environment:
      <<: *api-env
      WORKER_MODE: "true"
    volumes:
      - nymeria_data:/data
      - nymeria_workspace:/workspace
      - ./nymeria:/app/nymeria        # Bind mount: live code sync
      - ./run.py:/app/run.py          # Bind mount: live entry point
      - ./.env.docker:/app/.env.docker  # Bind mount: settings persist across restarts
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "run.py worker"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - nymeria-network

  # Watchdog thin-client worker (polls API for stale TODOs)
  watchdog:
    <<: *security-hardening
    build:
      context: .
      dockerfile: Dockerfile.full
    container_name: nymeria-watchdog
    restart: unless-stopped
    command: ["python", "run.py", "watchdog", "--api-url", "http://nymeria-api:8000"]
    environment:
      <<: *api-env
    volumes:
      - nymeria_data:/data                    # for kill-switch file at /data/flags/watchdog-off
      - ./nymeria:/app/nymeria                # Bind mount: live code sync
      - ./run.py:/app/run.py                  # Bind mount: live entry point
      - ./.env.docker:/app/.env.docker        # Bind mount: settings persist across restarts
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "run.py watchdog"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - nymeria-network

  # Discord Bot for two-way communication
  discord-bot:
    <<: *security-hardening
    build:
      context: .
      dockerfile: Dockerfile.full
    container_name: nymeria-discord-bot
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: ["python", "run.py", "discord-bot", "--api-url", "http://nymeria-api:8000"]
    profiles:
      - discord  # Only starts when explicitly enabled: docker compose --profile discord up -d
    environment:
      <<: *api-env
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?DISCORD_BOT_TOKEN is required for discord-bot service}
      DISCORD_MODE: ${DISCORD_MODE:-gateway}
      DISCORD_RESPOND_MODE: ${DISCORD_RESPOND_MODE:-mention}
    volumes:
      - nymeria_data:/data
      - ./nymeria:/app/nymeria
      - ./run.py:/app/run.py
      - ./.env.docker:/app/.env.docker
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "run.py discord-bot"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - nymeria-network

  # Telegram Bot for two-way communication
  telegram-bot:
    <<: *security-hardening
    build:
      context: .
      dockerfile: Dockerfile.full
    container_name: nymeria-telegram-bot
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: ["python", "run.py", "telegram-bot", "--api-url", "http://nymeria-api:8000"]
    profiles:
      - telegram  # Only starts when explicitly enabled: docker compose --profile telegram up -d
    environment:
      <<: *api-env
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required for telegram-bot service}
      TELEGRAM_DEFAULT_CHAT_ID: ${TELEGRAM_DEFAULT_CHAT_ID:-}
    volumes:
      - nymeria_data:/data
      - ./nymeria:/app/nymeria
      - ./run.py:/app/run.py
      - ./.env.docker:/app/.env.docker
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "run.py telegram-bot"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - nymeria-network

  # Twitch Bot for chat integration
  twitch-bot:
    <<: *security-hardening
    build:
      context: .
      dockerfile: Dockerfile.full
    container_name: nymeria-twitch-bot
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: ["python", "run.py", "twitch-bot"]
    profiles:
      - twitch  # Only starts when explicitly enabled: docker compose --profile twitch up -d
    environment:
      <<: *api-env
      COMPACT_THRESHOLD: ${TWITCH_COMPACT_THRESHOLD:-0.2}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      TWITCH_BOT_ACCESS_TOKEN: ${TWITCH_BOT_ACCESS_TOKEN:-}
      TWITCH_BOT_REFRESH_TOKEN: ${TWITCH_BOT_REFRESH_TOKEN:-}
      TWITCH_BOT_USER_ID: ${TWITCH_BOT_USER_ID:-}
      TWITCH_BROADCASTER_TOKEN: ${TWITCH_BROADCASTER_TOKEN:-}
      TWITCH_BROADCASTER_REFRESH_TOKEN: ${TWITCH_BROADCASTER_REFRESH_TOKEN:-}
      TWITCH_CHANNEL: ${TWITCH_CHANNEL:-}
      TWITCH_SYSTEM_PROMPT: ${TWITCH_SYSTEM_PROMPT:-}
      TWITCH_BUFFER_SIZE: ${TWITCH_BUFFER_SIZE:-500}
      TWITCH_PULSE_ENABLED: ${TWITCH_PULSE_ENABLED:-true}
      TWITCH_PULSE_INTERVAL: ${TWITCH_PULSE_INTERVAL:-300}
      TWITCH_PULSE_MESSAGE_COUNT: ${TWITCH_PULSE_MESSAGE_COUNT:-100}
      TWITCH_COMMAND_CONTEXT_COUNT: ${TWITCH_COMMAND_CONTEXT_COUNT:-50}
      TWITCH_RESPOND_MODE: ${TWITCH_RESPOND_MODE:-command}
    volumes:
      - nymeria_data:/data
      - nymeria_workspace:/workspace
      - ./nymeria:/app/nymeria
      - ./run.py:/app/run.py
      - ./.env.docker:/app/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "run.py twitch-bot"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - nymeria-network

  # MCP Server for agent-to-agent communication
  mcp:
    <<: *security-hardening
    build:
      context: .
      dockerfile: Dockerfile.full
    container_name: nymeria-mcp
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "run.py", "mcp", "--http", "--host", "0.0.0.0", "--port", "8001", "--api-url", "http://nymeria-api:8000"]
    ports:
      - "${MCP_PORT:-8001}:8001"
    environment:
      <<: *api-env
    volumes:
      - nymeria_data:/data
      - nymeria_workspace:/workspace
      - ./nymeria:/app/nymeria        # Bind mount: live code sync
      - ./run.py:/app/run.py          # Bind mount: live entry point
      - ./.env.docker:/app/.env.docker  # Bind mount: settings persist across restarts
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "run.py mcp"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - nymeria-network

  # ============================================================================
  # Voice Services (optional, GPU required)
  # Start with: docker compose --env-file .env.docker --profile voice up -d
  # ============================================================================

  # Qwen3-TTS — Local text-to-speech with OpenAI-compatible API
  qwen3-tts:
    <<: *security-hardening
    image: ghcr.io/groxaxo/qwen3-tts-openai-fastapi:latest
    container_name: nymeria-qwen3-tts
    restart: unless-stopped
    profiles:
      - voice
    ports:
      - "${TTS_PORT:-8880}:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      MODEL_NAME: ${TTS_MODEL:-Qwen3-TTS-0.6B}
    volumes:
      - qwen3_tts_models:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    networks:
      - nymeria-network

  # Faster-Whisper — Local speech-to-text with OpenAI-compatible API
  faster-whisper:
    <<: *security-hardening
    image: fedirz/faster-whisper-server:latest
    container_name: nymeria-faster-whisper
    restart: unless-stopped
    profiles:
      - voice
    ports:
      - "${STT_PORT:-8003}:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      WHISPER__MODEL: ${STT_MODEL:-large-v3-turbo}
    volumes:
      - whisper_models:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - nymeria-network

# ============================================================================
# Volumes
# ============================================================================

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nymeria_data:
    driver: local
  nymeria_workspace:
    driver: local
  qwen3_tts_models:
    driver: local
  whisper_models:
    driver: local

# ============================================================================
# Networks
# ============================================================================

networks:
  nymeria-network:
    driver: bridge
