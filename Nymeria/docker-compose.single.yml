# Nymeria SINGLE-CONTAINER SLIM stack.
#
# One container running `python run.py slim` (API + in-process ticker, incl.
# the watchdog sweep, + embedded MCP) on SQLite. No Postgres, no Redis, no
# worker. This is the containerized equivalent of bare-metal `python3 run.py slim`.
#
# Usage:
#   docker compose -f docker-compose.single.yml up -d --build
#   docker compose -f docker-compose.single.yml logs -f
#   docker compose -f docker-compose.single.yml down
#   Chat-app bots (token in .env.docker first; see the bot services at the end):
#   docker compose -f docker-compose.single.yml --env-file .env.docker --profile telegram up -d
#
# Data (SQLite DBs, accounts, bootstrap/service tokens) lives in the
# nymeria_single_data volume, kept separate from the main stack's nymeria_data
# volume so this test never touches a production deployment's state.

# Chat-app bot sidecars (#101 entry 15 of 2026-08-23): thin clients of the app
# service, run from its own image (which carries the Discord, Telegram, and
# Slack SDKs; Twitch needs the full stack or a native install). Hardened like
# the full stack's bots: read-only rootfs, no capabilities, small limits. The
# data volume carries the service token the app self-mints (and the bot's log
# file; its heartbeat is on the /tmp tmpfs). An image built before these SDKs
# needs `--build` once on the bot's `up -d` (`nymeria init` detects that).
x-single-bot: &single-bot
  image: nymeria-single:local
  build:
    context: .
    dockerfile: Dockerfile.single
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp
    - /home/nymeria
  mem_limit: 384m
  memswap_limit: 384m
  cpus: 0.5
  pids_limit: 128
  volumes:
    - nymeria_single_data:/data
    - ./nymeria:/app/nymeria:ro
    - ./run.py:/app/run.py:ro
  depends_on:
    nymeria-single:
      condition: service_healthy

# A bot gets only its own curated variables, never the whole env file (which
# carries the vault key and the provider keys set there). They are interpolated, so a
# bot profile needs `--env-file .env.docker` on the compose command.
x-single-bot-env: &single-bot-env
  TZ: ${USER_TIMEZONE:-UTC}
  NYMERIA_SERVICE_TOKEN: ${NYMERIA_SERVICE_TOKEN:-}
  NYMERIA_DATA_DIR: /data
  USER_TIMEZONE: ${USER_TIMEZONE:-UTC}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_PROFILES: ${LOG_PROFILES:-}
  LOG_MODULES: ${LOG_MODULES:-}

services:
  nymeria-single:
    image: nymeria-single:local
    build:
      context: .
      dockerfile: Dockerfile.single
    container_name: nymeria-single
    restart: unless-stopped
    # PID 1 reaper so any MCP subprocess grandchildren don't zombify.
    init: true
    # run.py auto-loads .env.docker; slim then forces sqlite + redis-off.
    env_file:
      - .env.docker
    environment:
      NYMERIA_DATA_DIR: /data
      NYMERIA_WORKSPACE_DIR: /workspace
      # Where settings changed in the app persist (#254): the data volume, not
      # the image tree, which a recreate discards. Wins over .env.docker.
      NYMERIA_SETTINGS_FILE: /data/settings.env
      # The host side of the port mapping below (the same expression), which
      # is where a browser on this host reaches the API: OAuth localhost
      # redirects use it, since the container itself always listens on 8000.
      NYMERIA_PUBLISHED_API_PORT: ${API_PORT:-8000}
    # Lets the in-process agent reach CLIProxy (and any other host service) via
    # http://host.docker.internal:<port> from inside the container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Published on loopback only. The Cloudflare tunnel (cloudflared runs on the
    # host) reaches it at localhost:<API_PORT>; nothing is exposed to the LAN.
    # Host side follows API_PORT (interpolated from .env.docker when compose is
    # invoked with `--env-file .env.docker`, as `nymeria init` does for a
    # non-default port); the container side stays 8000 (Dockerfile.single pins
    # `--port 8000`, so an API_PORT injected via env_file cannot move it).
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - nymeria_single_data:/data
      - nymeria_single_workspace:/workspace
      # Live code sync for iterating without a rebuild (matches main compose).
      - ./nymeria:/app/nymeria:ro
      - ./run.py:/app/run.py:ro
      # Web UI / Outlook add-in frontend. Uncomment once nymeria-desktop/build
      # exists (npm run build in ../nymeria-desktop). Without it the API still
      # serves fine; it just won't serve a browser UI at /.
      # - ../nymeria-desktop/build:/app/frontend:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Keyless web search sidecar for web_search_searxng, behind the `search`
  # profile (mirrors the main stack's sidecar):
  #   docker compose -f docker-compose.single.yml --profile search up -d
  # Internal-only: no host port; the slim container reaches it at
  # http://searxng:8080 on the default compose network. For the tool to use it,
  # set SEARXNG_BASE_URL=http://searxng:8080 in .env.docker (the setup wizard
  # writes this when SearXNG is selected). JSON output (which the tool
  # requires) is enabled in ./searxng/settings.yml. Image is digest-pinned for
  # reproducibility; bump by re-pulling searxng/searxng:latest and updating the
  # @sha256 below (pinned 2026-06 from searxng/searxng:latest, kept in lockstep
  # with docker-compose.yml).
  searxng:
    image: searxng/searxng@sha256:35b089054ac9b4257976107e71673d9e30ac17c9b50bbf8b4783f2f6d1d1981f
    container_name: nymeria-single-searxng
    restart: unless-stopped
    profiles:
      - search
    # SearXNG's entrypoint chowns its config and drops to an unprivileged uid,
    # so it needs these three caps back on top of the cap_drop ALL baseline.
    # no-new-privileges is intentionally NOT set here (it can break the
    # entrypoint's privilege drop).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.75
    pids_limit: 128
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      # Signs the web UI's cookies/CSRF tokens; substituted into settings.yml at
      # startup. Change it for any non-local deployment.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-nymeria-searxng-internal-change-me}
      SEARXNG_UWSGI_WORKERS: ${SEARXNG_WORKERS:-2}
      SEARXNG_UWSGI_THREADS: ${SEARXNG_THREADS:-2}
    volumes:
      - ./searxng:/etc/searxng:rw
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # Chat-app bots, one profile each (discord, telegram, slack). Put the
  # platform's token in .env.docker (DISCORD_BOT_TOKEN, TELEGRAM_BOT_TOKEN, or
  # SLACK_BOT_TOKEN plus SLACK_APP_TOKEN), then start it with the stack:
  #   docker compose -f docker-compose.single.yml --env-file .env.docker --profile telegram up -d
  # Setup per platform: docs/chat-apps/<platform>-bot.md.
  discord-bot:
    <<: *single-bot
    container_name: nymeria-single-discord-bot
    command: ["python", "run.py", "discord-bot", "--api-url", "http://nymeria-single:8000"]
    profiles:
      - discord
    environment:
      <<: *single-bot-env
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_MODE: ${DISCORD_MODE:-gateway}
      DISCORD_RESPOND_MODE: ${DISCORD_RESPOND_MODE:-mention}
      DISCORD_REACTION_TRIGGER_ENABLED: ${DISCORD_REACTION_TRIGGER_ENABLED:-false}
      DISCORD_DEFAULT_ACCOUNT: ${DISCORD_DEFAULT_ACCOUNT:-}
      DISCORD_DEFAULT_ACCOUNT_GUILDS: ${DISCORD_DEFAULT_ACCOUNT_GUILDS:-}
    healthcheck:
      test: ["CMD", "python", "-m", "nymeria.core.service_health", "check", "discord-bot", "--api-url", "http://nymeria-single:8000"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  telegram-bot:
    <<: *single-bot
    container_name: nymeria-single-telegram-bot
    command: ["python", "run.py", "telegram-bot", "--api-url", "http://nymeria-single:8000"]
    profiles:
      - telegram
    environment:
      <<: *single-bot-env
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_DEFAULT_CHAT_ID: ${TELEGRAM_DEFAULT_CHAT_ID:-}
      TELEGRAM_REACTION_TRIGGER_ENABLED: ${TELEGRAM_REACTION_TRIGGER_ENABLED:-false}
    healthcheck:
      test: ["CMD", "python", "-m", "nymeria.core.service_health", "check", "telegram-bot", "--api-url", "http://nymeria-single:8000"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  slack-bot:
    <<: *single-bot
    container_name: nymeria-single-slack-bot
    command: ["python", "run.py", "slack-bot", "--api-url", "http://nymeria-single:8000"]
    profiles:
      - slack
    environment:
      <<: *single-bot-env
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_RESPOND_MODE: ${SLACK_RESPOND_MODE:-mention}
      SLACK_SHOW_TOOL_EVENTS: ${SLACK_SHOW_TOOL_EVENTS:-false}
    healthcheck:
      test: ["CMD", "python", "-m", "nymeria.core.service_health", "check", "slack-bot", "--api-url", "http://nymeria-single:8000"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  nymeria_single_data:
    driver: local
  nymeria_single_workspace:
    driver: local
