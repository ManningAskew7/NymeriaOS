    <script>
      // Pre-boot theme: paint the right page background before the JS bundle
      // runs, so a Light-theme user never sees the dark static-CSS fallback
      // flash (and vice versa). Only data-theme + the base background are set
      // here; the full token set still comes from applyTheme() in themes.ts.
      // The bgBase values below mirror themes.ts and must move with it.
      try {
        var themeName = 'light';
        var cfg = localStorage.getItem('nymeria-config');
        if (cfg) {
          var parsed = JSON.parse(cfg);
          if (parsed && typeof parsed.theme === 'string') themeName = parsed.theme;
        }
        var themeBg = { midnight: '#121417', light: '#f1ead7', platinum: '#0d0e12' };
        if (!themeBg[themeName]) themeName = 'light';
        document.documentElement.setAttribute('data-theme', themeName);
        document.documentElement.style.setProperty('--bg-base', themeBg[themeName]);
        document.documentElement.style.backgroundColor = themeBg[themeName];
      } catch (e) {}

      try {
        var f = localStorage.getItem('nymeria_font_family');
        if (f) document.documentElement.style.setProperty('--font-sans', f);
      } catch (e) {}
      // Apply persisted logo-font choice before app loads (testing-only override)
      try {
        var lf = localStorage.getItem('nymeria_logo_font');
        if (lf) document.documentElement.style.setProperty('--font-logo', lf);
      } catch (e) {}
      // Apply persisted heading-font choice before app loads (testing-only override)
      try {
        var hf = localStorage.getItem('nymeria_heading_font');
        if (hf) document.documentElement.style.setProperty('--font-heading', hf);
      } catch (e) {}
      // Apply persisted logo size / weight / opacity before app loads
      try {
        var ls = localStorage.getItem('nymeria_logo_size');
        if (ls) document.documentElement.style.setProperty('--logo-font-size', ls + 'px');
        var lwn = localStorage.getItem('nymeria_logo_weight_name');
        if (lwn) document.documentElement.style.setProperty('--logo-weight-name', lwn);
        var lwo = localStorage.getItem('nymeria_logo_weight_os');
        if (lwo) document.documentElement.style.setProperty('--logo-weight-os', lwo);
        var lon = localStorage.getItem('nymeria_logo_opacity_name');
        if (lon) document.documentElement.style.setProperty('--logo-opacity-name', (Number(lon) / 100).toString());
        var loo = localStorage.getItem('nymeria_logo_opacity_os');
        if (loo) document.documentElement.style.setProperty('--logo-opacity-os', (Number(loo) / 100).toString());
        var lc = localStorage.getItem('nymeria_logo_color');
        if (lc === 'white') document.documentElement.style.setProperty('--logo-color', '#ffffff');
        else if (lc === 'black') document.documentElement.style.setProperty('--logo-color', '#000000');
      } catch (e) {}
      // Apply persisted chat-bubble preference. Bubbles are the CSS default;
      // only an explicit 'off' flattens them (SettingsPanel keeps the same rule).
      try {
        var b = localStorage.getItem('nymeria_chat_bubbles');
        if (b === 'off') document.documentElement.setAttribute('data-chat-bubbles', 'off');
      } catch (e) {}
      // Apply persisted interface-spacing choice before app loads. Only a stored
      // 4/8/16/24 sets the override; absence leaves each area's built-in spacing.
      try {
        var sp = localStorage.getItem('nymeria_ui_spacing');
        if (sp === '4' || sp === '8' || sp === '16' || sp === '24')
          document.documentElement.style.setProperty('--ui-density-gap', sp + 'px');
      } catch (e) {}
    </script>
