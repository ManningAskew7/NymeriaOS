# Nymeria SINGLE-CONTAINER stack, CLONE-FREE (published image).
#
# Same shape as docker-compose.single.yml but pulls a PUBLISHED image instead of
# building from a source checkout, and bakes the frontend/source into the image
# (no live bind-mounts). This is the simplest clone-free Docker deployment: one
# container running `python run.py slim` (API + in-process ticker + watchdog +
# embedded MCP) on SQLite. No Postgres, no Redis, no separate worker.
#
# Usage (no git clone required):
#   1. Fetch this file and the env template:
#        curl -fsSLO https://<host>/docker-compose.single.published.yml
#        curl -fsSL  https://<host>/.env.docker.example -o .env.docker
#   2. Fill in .env.docker (at minimum an LLM provider key and NYMERIA_SECRETS_KEY).
#   3. docker compose -f docker-compose.single.published.yml up -d
#
# Image source is overridable for testing or once the public repo/registry is
# live:
#   NYMERIA_IMAGE_NAMESPACE=ghcr.io/<owner>   (default below)
#   NYMERIA_VERSION=<tag>                      (default: latest)

services:
  nymeria-single:
    image: ${NYMERIA_IMAGE_NAMESPACE:-ghcr.io/manningaskew7}/nymeria-single:${NYMERIA_VERSION:-latest}
    container_name: nymeria-single
    restart: unless-stopped
    pull_policy: always
    # PID 1 reaper so any MCP subprocess grandchildren don't zombify.
    init: true
    # run.py auto-loads .env.docker; slim then forces sqlite + redis-off.
    env_file:
      - .env.docker
    environment:
      NYMERIA_DATA_DIR: /data
      NYMERIA_WORKSPACE_DIR: /workspace
    # Lets the in-process agent reach CLIProxy (and any other host service) via
    # http://host.docker.internal:<port> from inside the container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Published on loopback only by default; front it with a reverse proxy/tunnel
    # for remote access rather than exposing the port to the LAN.
    # Host side follows API_PORT (set it in the shell or pass
    # `--env-file .env.docker` so compose interpolates it); the container side
    # stays 8000 (the image's CMD pins `--port 8000`).
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - nymeria_single_data:/data
      - nymeria_single_workspace:/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Keyless web search sidecar for web_search_searxng, behind the `search`
  # profile (mirrors the source stacks' sidecar):
  #   docker compose -f docker-compose.single.published.yml --env-file .env.docker --profile search up -d
  # Internal-only: no host port; the slim container reaches it at
  # http://searxng:8080 on the default compose network. For the tool to use it,
  # set SEARXNG_BASE_URL=http://searxng:8080 in .env.docker (the setup wizard
  # writes this when SearXNG is selected). JSON output (which the tool
  # requires) is enabled in ./searxng/settings.yml, which `nymeria init`
  # materializes next to this file on clone-free installs. Image is
  # digest-pinned for reproducibility; bump by re-pulling searxng/searxng:latest
  # and updating the @sha256 below (pinned 2026-06 from searxng/searxng:latest,
  # kept in lockstep with docker-compose.yml).
  searxng:
    image: searxng/searxng@sha256:35b089054ac9b4257976107e71673d9e30ac17c9b50bbf8b4783f2f6d1d1981f
    container_name: nymeria-single-searxng
    restart: unless-stopped
    profiles:
      - search
    # SearXNG's entrypoint chowns its config and drops to an unprivileged uid,
    # so it needs these three caps back on top of the cap_drop ALL baseline.
    # no-new-privileges is intentionally NOT set here (it can break the
    # entrypoint's privilege drop).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.75
    pids_limit: 128
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      # Signs the web UI's cookies/CSRF tokens; substituted into settings.yml at
      # startup. Change it for any non-local deployment.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-nymeria-searxng-internal-change-me}
      SEARXNG_UWSGI_WORKERS: ${SEARXNG_WORKERS:-2}
      SEARXNG_UWSGI_THREADS: ${SEARXNG_THREADS:-2}
    volumes:
      - ./searxng:/etc/searxng:rw
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

volumes:
  nymeria_single_data:
    driver: local
  nymeria_single_workspace:
    driver: local
